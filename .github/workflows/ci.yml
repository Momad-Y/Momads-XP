name: CI

on:
    push:
        branches: [dev, main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck (svelte-check, strict)
              run: npm run check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: VFS seed freshness (generated == committed)
              run: |
                  npx tsc --noEmit --strict --skipLibCheck --resolveJsonModule --module esnext --moduleResolution bundler --target es2022 scripts/generate-vfs.ts
                  npm run generate:vfs
                  git diff --exit-code static/json/hard_drive.json src/lib/generated

            - name: Unit tests (coverage-gated)
              run: npx vitest run --coverage

            - name: Diff coverage vs dev (>=80% on changed lines, PRs only)
              if: github.event_name == 'pull_request'
              run: |
                  python3 -m pip install --quiet diff-cover
                  diff-cover coverage/lcov.info --compare-branch origin/dev --fail-under 80

            - name: Production build
              # `set -o pipefail` is REQUIRED. Actions' default shell is
              # `bash -e`, and -e does NOT imply pipefail — so without it the
              # step's exit status is tee's, and a build that fails after
              # emitting build/index.html passes this gate.
              shell: bash
              run: |
                  set -o pipefail
                  npm run build 2>&1 | tee /tmp/build.log

            # Assertions no other gate can make: vitest only sees
            # src/**/*.test.ts and runs BEFORE the build, and Rollup's
            # code-splitting warning goes to stdout that nothing captured.
            # Also enforces the T2 jspaint prune (pruned paths absent, and
            # classic.css — which index.html never references — still present).
            - name: Verify build output
              run: node scripts/verify-build.mjs /tmp/build.log

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            # Hermetic. Nothing here touches the network, so it cannot go red
            # because a CDN did.
            - name: E2E (hermetic)
              run: npx playwright test --project=default
              env:
                  CI: 'true'

            # Real Pyodide, ~5 MB from jsDelivr per spec. Run where production
            # risk actually is — the cutover into `main`, and `main` itself —
            # rather than on every PR into `dev`. Phase 3 shipped two bugs that
            # ONLY a real runtime could catch (a module worker on an opaque
            # origin, and the sandbox CSP), so this must not simply be dropped.
            - name: E2E (real Pyodide — cutovers into main)
              if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
              run: npx playwright test --project=online
              env:
                  CI: 'true'
