name: CI

on:
    push:
        branches: [dev, main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck (svelte-check, strict)
              run: npm run check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: VFS seed freshness (generated == committed)
              run: |
                  npx tsc --noEmit --strict --skipLibCheck --resolveJsonModule --module esnext --moduleResolution bundler --target es2022 scripts/generate-vfs.ts
                  npm run generate:vfs
                  git diff --exit-code static/json/hard_drive.json src/lib/generated

            - name: Unit tests (coverage-gated)
              run: npx vitest run --coverage

            - name: Diff coverage vs dev (>=80% on changed lines, PRs only)
              if: github.event_name == 'pull_request'
              run: |
                  python3 -m pip install --quiet diff-cover
                  diff-cover coverage/lcov.info --compare-branch origin/dev --fail-under 80

            - name: Production build
              run: npm run build

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: E2E smoke tests
              run: npx playwright test
              env:
                  CI: 'true'
